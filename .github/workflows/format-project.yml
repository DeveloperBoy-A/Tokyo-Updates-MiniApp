name: Format Project Source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format source files
        run: |
          npx --yes prettier@3.3.3 --write "**/*.{ts,tsx,js,jsx,json,md,mdx,css,yml,yaml}"
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "All source files already formatted."
          else
            git commit -m "[format-bot] Format project source files"
            git push origin main
          fi
